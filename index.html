    const DEFAULT_APPLICATIONS = [

    const DEFAULT_NOTIFICATIONS = [
      {
        id: 'notif-1',
        type: 'email_dispatched',
        toEmail: 'admin@scholarhire.edu',
        candidateName: 'Dr. Elena Rostova',

    // State Manager
    class StateManager {
      constructor() {
        this.load();
      }

      load() {
        try {
          const storedJobs = localStorage.getItem('scholarhire_jobs_v3');
          const storedApps = localStorage.getItem('scholarhire_applications');
          const storedRole = localStorage.getItem('scholarhire_role');
          const storedUserEmail = localStorage.getItem('scholarhire_user_email');
          const storedAdminEmail = localStorage.getItem('scholarhire_admin_email');
          const storedNotifs = localStorage.getItem('scholarhire_notifications');

          this.jobs = storedJobs ? JSON.parse(storedJobs) : DEFAULT_JOBS;
          this.applications = storedApps ? JSON.parse(storedApps) : DEFAULT_APPLICATIONS;
          this.notifications = storedNotifs ? JSON.parse(storedNotifs) : DEFAULT_NOTIFICATIONS;
          this.currentRole = storedRole || 'user'; // 'user' or 'admin'
          this.userEmail = storedUserEmail || 'elena.rostova@scholarhub.edu';
          this.adminEmail = storedAdminEmail || 'admin@scholarhire.edu';
          this.activeTab = this.currentRole === 'admin' ? 'dashboard' : 'browse';
          
          this.searchQuery = '';
          this.filterDept = 'All';
          this.filterType = 'All';
          
          // Modals
          this.activeJobModal = null;
          this.activeApplyModal = null;
          this.activeJobEditorModal = null;
          this.activeAppReviewModal = null;
          this.activeEmailPreviewModal = null;
          this.activeShareModal = null; // job object for share modal
          this.showNotificationDrawer = false;
        } catch (e) {
          console.error('Failed to load state', e);
          this.resetToDefaults();
        }
      }

      save() {
        localStorage.setItem('scholarhire_jobs_v3', JSON.stringify(this.jobs));
        localStorage.setItem('scholarhire_applications', JSON.stringify(this.applications));
        localStorage.setItem('scholarhire_notifications', JSON.stringify(this.notifications));
        localStorage.setItem('scholarhire_role', this.currentRole);
        localStorage.setItem('scholarhire_user_email', this.userEmail);
        localStorage.setItem('scholarhire_admin_email', this.adminEmail);
      }

      resetToDefaults() {
        this.jobs = JSON.parse(JSON.stringify(DEFAULT_JOBS));
        this.applications = JSON.parse(JSON.stringify(DEFAULT_APPLICATIONS));
        this.notifications = JSON.parse(JSON.stringify(DEFAULT_NOTIFICATIONS));
        this.currentRole = 'user';
        this.adminEmail = 'admin@scholarhire.edu';
        this.activeTab = 'browse';
        this.save();
        render();
        showToast('Reset to ScholarHire demo data successfully!', 'info');
      }

      setRole(newRole) {
        this.currentRole = newRole;
        this.activeTab = newRole === 'admin' ? 'dashboard' : 'browse';
        this.save();
        render();
      }

      setAdminEmail(newEmail) {
        if (newEmail && newEmail.includes('@')) {
          this.adminEmail = newEmail.trim();
          this.save();
          render();
          showToast(`Admin alert email updated to: ${this.adminEmail}`, 'success');
        } else {
          showToast('Please enter a valid email address.', 'error');
        }
      }

      addJob(jobData) {
        const newJob = {
          id: 'job-' + Date.now(),
          ...jobData,
          postedDate: new Date().toISOString().split('T')[0],
          status: 'Active'
        };
        this.jobs.unshift(newJob);
        this.save();
        render();
        showToast('Academic job opening posted successfully!', 'success');
      }

      updateJob(id, updatedFields) {
        const index = this.jobs.findIndex(j => j.id === id);
        if (index !== -1) {
          this.jobs[index] = { ...this.jobs[index], ...updatedFields };
          this.save();
          render();
          showToast('Job listing updated!', 'success');
        }
      }

      deleteJob(id) {
        if (confirm('Are you sure you want to delete this job posting? Associated applications will remain in archive.')) {
          this.jobs = this.jobs.filter(j => j.id !== id);
          this.save();
          render();
          showToast('Job posting removed.', 'info');
        }
      }

      addApplication(applicationData) {
        const appId = 'app-' + Date.now();
        const now = new Date();
        const formattedTimestamp = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const newApp = {
          id: appId,
          ...applicationData,
          appliedDate: now.toISOString().split('T')[0],
          status: 'Applied',
          notes: ''
        };
        this.applications.unshift(newApp);

        // CREATE & DISPATCH EMAIL NOTIFICATION TO ADMIN
        const emailSubject = `[ScholarHire Alert] New Application: ${newApp.applicantName} for ${newApp.jobTitle}`;
        const emailPreview = `${newApp.applicantName} (${newApp.applicantEmail}) applied for ${newApp.jobTitle}. CV: ${newApp.resumeFileName || 'CV.pdf'}.`;
        
        const newNotification = {
          id: 'notif-' + Date.now(),
          type: 'email_dispatched',
          toEmail: this.adminEmail,
          candidateName: newApp.applicantName,
          candidateEmail: newApp.applicantEmail,
          jobTitle: newApp.jobTitle,
          timestamp: formattedTimestamp,
          subject: emailSubject,
          preview: emailPreview,
          coverLetter: newApp.coverLetter || 'No cover statement provided.',
          experience: newApp.experience || 'Not specified',
          phone: newApp.applicantPhone || 'Not provided',
          portfolio: newApp.portfolio || '',
          linkedin: newApp.linkedin || '',
          resumeFileName: newApp.resumeFileName || 'Candidate_CV.pdf',
          read: false,
          appId: appId
        };

        this.notifications.unshift(newNotification);
        this.save();

        showEmailDispatchedToast(newNotification);
        render();
      }

      updateApplicationStatus(appId, newStatus, newNotes = null) {
        const app = this.applications.find(a => a.id === appId);
        if (app) {
          app.status = newStatus;
          if (newNotes !== null) app.notes = newNotes;
          this.save();
          render();
          showToast(`Application status updated to "${newStatus}"`, 'success');
        }
      }

      withdrawApplication(appId) {
        if (confirm('Are you sure you want to withdraw this application?')) {
          this.applications = this.applications.filter(a => a.id !== appId);
          this.save();
          render();
          showToast('Application withdrawn.', 'info');
        }
      }

      markAllNotificationsAsRead() {
        this.notifications.forEach(n => n.read = true);
        this.save();
        render();
      }

      getUnreadNotificationsCount() {
        return this.notifications.filter(n => !n.read).length;
      }
    }

    const state = new StateManager();

    // Check URL parameters for direct job share link on initial load

    // Custom Toast Notification System
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const bgColors = {
        success: 'bg-emerald-600 text-white shadow-emerald-200',
        info: 'bg-brand-600 text-white shadow-brand-200',
        warning: 'bg-amber-500 text-white shadow-amber-200',
        error: 'bg-rose-600 text-white shadow-rose-200'
      };
      
      const icons = {
        success: 'fa-circle-check',
        info: 'fa-circle-info',
        warning: 'fa-triangle-exclamation',
        error: 'fa-circle-xmark'
      };

      toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-lg transform transition-all duration-300 translate-y-3 opacity-0 text-sm font-medium ${bgColors[type] || bgColors.info}`;
      toast.innerHTML = `
        <i class="fa-solid ${icons[type] || icons.info} text-base"></i>
        <span>${message}</span>
      `;
      
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Special Toast for Email Notification Dispatch
    function showEmailDispatchedToast(notif) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      toast.className = `pointer-events-auto flex flex-col p-4 rounded-2xl shadow-xl bg-slate-900 text-white border border-brand-400/40 transform transition-all duration-300 translate-y-3 opacity-0 text-xs max-w-sm`;
      toast.innerHTML = `
        <div class="flex items-center justify-between gap-3 mb-2">
          <div class="flex items-center gap-2 text-brand-400 font-bold">
            <span class="w-2 h-2 rounded-full bg-brand-400 animate-ping"></span>
            <i class="fa-solid fa-paper-plane"></i>
            <span>Email Notification Dispatched</span>
          </div>
          <span class="text-[10px] text-slate-400">Just now</span>
        </div>
        <p class="text-slate-300 text-[11px] leading-relaxed">
          Admin alert sent to <strong class="text-white">${escapeHtml(notif.toEmail)}</strong> for new applicant <strong class="text-brand-300">${escapeHtml(notif.candidateName)}</strong>.
        </p>
        <div class="mt-3 pt-2 border-t border-slate-800 flex items-center justify-between">
          <button onclick="openEmailPreviewModal('${notif.id}')" class="text-brand-400 hover:text-brand-300 font-semibold underline text-[11px] flex items-center gap-1">
            <i class="fa-solid fa-envelope-open-text"></i> View Dispatched Email
          </button>
          <span class="text-[10px] text-slate-400">ScholarHire Mailer</span>
        </div>
      `;
      
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-x-4');
        setTimeout(() => toast.remove(), 400);
      }, 6500);
    }

    function getStatusBadge(status) {
      const styles = {
        'Applied': 'bg-sky-100 text-sky-800 border-sky-200',
        'Under Review': 'bg-amber-100 text-amber-800 border-amber-200',
        'Interviewing': 'bg-purple-100 text-purple-800 border-purple-200',
        'Offer Extended': 'bg-emerald-100 text-emerald-800 border-emerald-200',
        'Rejected': 'bg-rose-100 text-rose-800 border-rose-200'
      };
      return `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${styles[status] || 'bg-slate-100 text-slate-700 border-slate-200'}">
        <span class="w-1.5 h-1.5 rounded-full ${status === 'Offer Extended' ? 'bg-emerald-500' : status === 'Interviewing' ? 'bg-purple-500' : status === 'Under Review' ? 'bg-amber-500' : status === 'Rejected' ? 'bg-rose-500' : 'bg-sky-500'}"></span>
        ${status}
      </span>`;
    }

    // Main App Renderer
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        ${renderHeader()}
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
          ${state.currentRole === 'admin' ? renderAdminPortal() : renderUserPortal()}
        </main>
        ${renderFooter()}
        ${renderModals()}
      `;
    }

    // Header Component

                </div>

                      ${isAdmin ? 'Admin Portal' : 'Candidate Portal'}
                    </span>
                  </div>
                  <p class="text-xs text-slate-500 -mt-0.5">Academic & Career Opportunity Tracker</p>
                </div>
              </div>

              <!-- Main Navigation Links -->
              <div class="hidden md:flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl">
                ${!isAdmin ? `
                  <button onclick="state.activeTab = 'browse'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${state.activeTab === 'browse' ? 'bg-white text-brand-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
                    <i class="fa-solid fa-compass mr-1.5 text-xs"></i> Browse Positions (${state.jobs.filter(j => j.status === 'Active').length})
                  </button>
                  <button onclick="state.activeTab = 'my-apps'; render();" class="px-4 py-2 rounded-lg text-sm font-semibold transition relative ${state.activeTab === 'my-apps' ? 'bg-white text-brand-600 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">
                    <i class="fa-solid fa-file-signature mr-1.5 text-xs"></i> My Applications
                    ${getUserApplicationsCount() > 0 ? `<span class="ml-1.5 px-1.5 py-0.2 rounded-full text-[11px] bg-brand-500 text-white font-bold">${getUserApplicationsCount()}</span>` : ''}
                  </button>
                ` : `

                ${isAdmin ? `
                  <button onclick="openJobEditorModal()" class="hidden sm:inline-flex items-center gap-2 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white font-semibold text-sm rounded-xl shadow-sm shadow-brand-500/25 transition">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>Post Opening</span>
                  </button>
                ` : ''}

                <!-- Role Switcher Pill -->
                <div class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button onclick="state.setRole('user')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${!isAdmin ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'}">
                    <i class="fa-solid fa-user-graduate text-brand-500"></i>
                    <span>Candidate</span>
                  </button>
                  <button onclick="state.setRole('admin')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition ${isAdmin ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'}">
                    <i class="fa-solid fa-shield-halved ${isAdmin ? 'text-white' : 'text-indigo-500'}"></i>
                    <span>Admin</span>

            </div>

            <!-- Mobile sub-navigation -->
            <div class="flex md:hidden border-t border-slate-100 py-2.5 gap-2 overflow-x-auto">
              ${!isAdmin ? `
                <button onclick="state.activeTab = 'browse'; render();" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${state.activeTab === 'browse' ? 'bg-brand-50 text-brand-700' : 'text-slate-600'}">
                  Browse Positions (${state.jobs.filter(j => j.status === 'Active').length})
                </button>
                <button onclick="state.activeTab = 'my-apps'; render();" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${state.activeTab === 'my-apps' ? 'bg-brand-50 text-brand-700' : 'text-slate-600'}">

                </button>
              ` : `
                <button onclick="state.activeTab = 'dashboard'; render();" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${state.activeTab === 'dashboard' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}">
                  Dashboard
                </button>
                <button onclick="state.activeTab = 'manage-jobs'; render();" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${state.activeTab === 'manage-jobs' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}">
                  Manage Jobs (${state.jobs.length})
                </button>
                <button onclick="state.activeTab = 'applicants'; render();" class="px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap ${state.activeTab === 'applicants' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600'}">
                  Candidates (${state.applications.length})
                </button>
              `}
            </div>
          </div>
        </header>
      `;
    }

    function getUserApplicationsCount() {
      return state.applications.filter(a => a.applicantEmail.toLowerCase() === state.userEmail.toLowerCase()).length;
    }

    // ==========================================
    // USER / CANDIDATE PORTAL VIEWS
    // ==========================================
    function renderUserPortal() {
      if (state.activeTab === 'my-apps') {
        return renderMyApplicationsView();
      }
      return renderJobBrowserView();
    }

    function renderJobBrowserView() {
      const filteredJobs = state.jobs.filter(job => {
        if (job.status !== 'Active') return false;
        const matchesQuery = job.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                             job.department.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
                             job.description.toLowerCase().includes(state.searchQuery.toLowerCase());
        const matchesDept = state.filterDept === 'All' || job.department === state.filterDept;
        const matchesType = state.filterType === 'All' || job.type === state.filterType;
        return matchesQuery && matchesDept && matchesType;
      });

      const departments = ['All', ...new Set(state.jobs.map(j => j.department))];
      const jobTypes = ['All', 'Full-time', 'Part-time', 'Contract', 'Internship'];

      return `
        <div class="space-y-8">
          
          <!-- Hero Section with Light Blue Theme -->
          <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-brand-50 via-white to-sky-100/60 border border-brand-100 p-8 sm:p-12 shadow-sm">
            <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-brand-200/40 rounded-full blur-3xl pointer-events-none"></div>
            <div class="max-w-3xl">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-brand-100 text-brand-800 mb-4">
                <i class="fa-solid fa-graduation-cap text-brand-500"></i> Academic & Professional Careers
              </span>
              <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">
                Advance Your Calling with <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-500 to-brand-700">ScholarHire</span>
              </h1>
              <p class="mt-3 text-base sm:text-lg text-slate-600 max-w-2xl">
                Explore faculty appointments and research opportunities. Teach undergraduate and postgraduate scholars, conduct impactful research, and easily share or apply to openings.
              </p>

              <!-- Search Bar -->
              <div class="mt-8 bg-white p-2.5 rounded-2xl shadow-lg shadow-brand-900/5 border border-slate-200 flex flex-col md:flex-row gap-2">
                <div class="flex-1 flex items-center px-4 py-2 gap-3 text-slate-400">
                  <i class="fa-solid fa-magnifying-glass text-brand-500"></i>
                  <input 
                    type="text" 
                    value="${escapeHtml(state.searchQuery)}"
                    placeholder="Search by academic discipline, research field, or keyword..." 
                    class="w-full text-sm text-slate-800 placeholder-slate-400 focus:outline-hidden"
                    oninput="state.searchQuery = this.value; render();"
                  >
                  ${state.searchQuery ? `
                    <button onclick="state.searchQuery = ''; render();" class="text-slate-400 hover:text-slate-600">
                      <i class="fa-solid fa-xmark"></i>
                    </button>
                  ` : ''}
                </div>

                <div class="flex flex-wrap sm:flex-nowrap gap-2">
                  <select 
                    class="text-xs font-medium bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-2.5 focus:outline-hidden focus:border-brand-400"
                    onchange="state.filterDept = this.value; render();"
                  >
                    ${departments.map(d => `<option value="${d}" ${state.filterDept === d ? 'selected' : ''}>Dept: ${d}</option>`).join('')}
                  </select>

                  <select 
                    class="text-xs font-medium bg-slate-50 border border-slate-200 text-slate-700 rounded-xl px-3 py-2.5 focus:outline-hidden focus:border-brand-400"
                    onchange="state.filterType = this.value; render();"
                  >
                    ${jobTypes.map(t => `<option value="${t}" ${state.filterType === t ? 'selected' : ''}>Type: ${t}</option>`).join('')}
                  </select>
                </div>
              </div>

              <!-- Candidate Profile Note -->
              <div class="mt-4 flex items-center gap-2 text-xs text-slate-500">
                <span class="font-medium text-slate-700">Active Candidate Profile:</span>
                <span class="bg-white/80 px-2 py-0.5 rounded-md border border-slate-200 font-mono text-slate-600">${state.userEmail}</span>
                <button onclick="promptUserEmail()" class="text-brand-600 hover:text-brand-700 underline font-medium">Switch Profile</button>
              </div>

            </div>
          </div>

          <!-- Listings Header -->
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h2 class="text-xl font-bold text-slate-900">Academic & Research Positions</h2>
              <p class="text-xs text-slate-500 mt-0.5">Showing ${filteredJobs.length} active position${filteredJobs.length === 1 ? '' : 's'}</p>
            </div>
            ${(state.searchQuery || state.filterDept !== 'All' || state.filterType !== 'All') ? `
              <button onclick="state.searchQuery = ''; state.filterDept = 'All'; state.filterType = 'All'; render();" class="text-xs font-semibold text-brand-600 hover:text-brand-700 flex items-center gap-1">
                <i class="fa-solid fa-filter-circle-xmark"></i> Clear all filters
              </button>
            ` : ''}
          </div>

          <!-- Job Cards Grid with Share, Details & Apply buttons -->
          ${filteredJobs.length === 0 ? `
            <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 p-8">
              <div class="w-14 h-14 bg-brand-50 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-book-open text-2xl"></i>
              </div>
              <h3 class="text-lg font-bold text-slate-800">No positions match your search</h3>
              <p class="text-sm text-slate-500 max-w-md mx-auto mt-1">Try broadening your search keywords or clear your department filters.</p>
              <button onclick="state.searchQuery = ''; state.filterDept = 'All'; state.filterType = 'All'; render();" class="mt-4 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-xs font-semibold transition">
                Reset Filters
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-5">
              ${filteredJobs.map(job => renderCandidateJobCard(job)).join('')}
            </div>
          `}

        </div>
      `;
    }

    // Candidate Job Card with Share Button, Details Button, and Apply Button
    function renderCandidateJobCard(job) {
      const alreadyApplied = state.applications.some(a => a.jobId === job.id && a.applicantEmail.toLowerCase() === state.userEmail.toLowerCase());

      return `
        <div class="bg-white rounded-2xl border border-slate-200/90 p-6 shadow-xs hover:shadow-md hover:border-brand-300 transition flex flex-col justify-between group">
          <div>
            <!-- Top Badges & Share quick action -->
            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-brand-50 text-brand-700 border border-brand-100">
                  ${escapeHtml(job.department)}
                </span>
                <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600">
                  ${escapeHtml(job.type)}
                </span>
              </div>
              
              <div class="flex items-center gap-1.5">
                ${alreadyApplied ? `
                  <span class="inline-flex items-center gap-1 text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200">
                    <i class="fa-solid fa-check-circle"></i> Applied
                  </span>
                ` : `
                  <span class="text-xs text-slate-400 flex items-center gap-1">
                    <i class="fa-regular fa-calendar"></i> Posted ${job.postedDate}
                  </span>
                `}
              </div>
            </div>

            <!-- Position Title -->
            <h3 class="text-lg font-bold text-slate-900 group-hover:text-brand-600 transition">
              ${escapeHtml(job.title)}
            </h3>

            <!-- Key Info Pills -->
            <div class="flex flex-wrap items-center gap-y-2 gap-x-4 mt-3 text-xs text-slate-500">
              <span class="flex items-center gap-1.5">
                <i class="fa-solid fa-location-dot text-brand-400"></i> ${escapeHtml(job.location)}
              </span>
              <span class="flex items-center gap-1.5">
                <i class="fa-solid fa-coins text-brand-400"></i> ${escapeHtml(job.salary || 'Academic scale')}
              </span>
              <span class="flex items-center gap-1.5">
                <i class="fa-solid fa-award text-brand-400"></i> ${escapeHtml(job.experience || 'Not specified')}
              </span>
            </div>

            <!-- Brief Highlights (Teaching & Research) -->
            <div class="mt-4 p-3 bg-brand-50/50 rounded-xl border border-brand-100/60 text-xs space-y-1.5 text-slate-700">
              <div class="flex items-start gap-2">
                <i class="fa-solid fa-graduation-cap text-brand-500 mt-0.5 text-xs"></i>
                <span class="line-clamp-1"><strong>Teaching:</strong> You will teach undergraduates and postgraduate students</span>
              </div>
              <div class="flex items-start gap-2">
                <i class="fa-solid fa-microscope text-brand-500 mt-0.5 text-xs"></i>
                <span class="line-clamp-1"><strong>Research:</strong> Conduct and publish research in peer-reviewed venues</span>
              </div>
            </div>

            <!-- Short Description -->
            <p class="mt-3 text-xs text-slate-600 line-clamp-2 leading-relaxed">
              ${escapeHtml(job.description)}
            </p>
          </div>

          <!-- Bottom Action Buttons: Share, Details, Apply -->
          <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap sm:flex-nowrap">
            
            <!-- 1. SHARE BUTTON -->
            <button 
              type="button"
              onclick="openShareModal('${job.id}')"
              class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-700 border border-slate-200 hover:border-brand-200 text-xs font-semibold transition flex items-center gap-1.5 shadow-2xs"
              title="Share job link"
            >
              <i class="fa-solid fa-share-nodes text-brand-500"></i>
              <span>Share</span>
            </button>

            <!-- 2. DETAILS BUTTON -->
            <button 
              type="button"
              onclick="openJobDetailModal('${job.id}')"
              class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition flex items-center gap-1.5 shadow-2xs"
              title="View full job details"
            >
              <i class="fa-solid fa-circle-info text-slate-500"></i>
              <span>Details</span>
            </button>

            <!-- 3. APPLY BUTTON -->
            ${alreadyApplied ? `
              <button 
                type="button"
                onclick="state.activeTab = 'my-apps'; render();"
                class="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold rounded-xl border border-emerald-200 transition flex items-center gap-1.5"
              >
                <i class="fa-solid fa-list-check"></i>
                <span>Track Status</span>
              </button>
            ` : `
              <button 
                type="button"
                onclick="openApplyModal('${job.id}')"
                class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-white text-xs font-semibold rounded-xl shadow-xs shadow-brand-500/25 transition flex items-center gap-1.5 flex-1 justify-center sm:flex-none"
              >
                <i class="fa-solid fa-paper-plane text-[11px]"></i>
                <span>Apply</span>
              </button>
            `}

          </div>

        </div>
      `;
    }

    // Candidate "My Applications"
    function renderMyApplicationsView() {
      const myApplications = state.applications.filter(
        a => a.applicantEmail.toLowerCase() === state.userEmail.toLowerCase()
      );

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold text-slate-900">My Scholar Applications</h1>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-brand-100 text-brand-700">${myApplications.length}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1">
                Submissions tracked under <strong class="text-slate-700">${escapeHtml(state.userEmail)}</strong>
              </p>
            </div>
            <button onclick="promptUserEmail()" class="text-xs font-semibold px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
              <i class="fa-solid fa-envelope mr-1 text-slate-400"></i> Change Email
            </button>
          </div>

          ${myApplications.length === 0 ? `
            <div class="bg-white rounded-2xl border border-slate-200 text-center py-16 px-6">
              <div class="w-16 h-16 bg-brand-50 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-regular fa-folder-open text-2xl"></i>
              </div>
              <h2 class="text-lg font-bold text-slate-800">No applications on record yet</h2>
              <p class="text-sm text-slate-500 max-w-md mx-auto mt-1">Search through available ScholarHire positions and submit your candidacy.</p>
              <button onclick="state.activeTab = 'browse'; render();" class="mt-5 px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-xs font-semibold shadow-xs transition">
                Browse Openings
              </button>
            </div>
          ` : `
            <div class="space-y-4">
              ${myApplications.map(app => renderUserApplicationCard(app)).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderUserApplicationCard(app) {
      const job = state.jobs.find(j => j.id === app.jobId);
      const stages = ['Applied', 'Under Review', 'Interviewing', 'Offer Extended'];
      const isRejected = app.status === 'Rejected';
      const currentIndex = stages.indexOf(app.status);

      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
          <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div class="flex items-center gap-3">
                <h3 class="text-lg font-bold text-slate-900">${escapeHtml(app.jobTitle)}</h3>
                ${getStatusBadge(app.status)}
              </div>
              <div class="flex flex-wrap items-center gap-4 mt-2 text-xs text-slate-500">
                <span><i class="fa-regular fa-calendar mr-1 text-slate-400"></i> Applied on ${app.appliedDate}</span>
                ${job ? `<span><i class="fa-solid fa-building-columns mr-1 text-slate-400"></i> ${escapeHtml(job.department)}</span>` : ''}
                <span><i class="fa-regular fa-file-pdf mr-1 text-slate-400"></i> ${escapeHtml(app.resumeFileName || 'CV.pdf')}</span>
                <span class="text-emerald-600 flex items-center gap-1 font-medium">
                  <i class="fa-solid fa-envelope-circle-check"></i> Admin Notified via Email
                </span>
              </div>
            </div>

            <div class="flex items-center gap-2">
              ${job ? `
                <button onclick="openShareModal('${job.id}')" class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg transition flex items-center gap-1">
                  <i class="fa-solid fa-share-nodes text-brand-500"></i> Share
                </button>
                <button onclick="openJobDetailModal('${job.id}')" class="px-3 py-1.5 text-xs font-semibold text-brand-600 hover:bg-brand-50 rounded-lg transition">
                  Details
                </button>
              ` : ''}
              <button onclick="state.withdrawApplication('${app.id}')" class="px-3 py-1.5 text-xs font-semibold text-rose-600 hover:bg-rose-50 rounded-lg transition">
                Withdraw
              </button>
            </div>
          </div>

          <!-- Progress Stepper -->
          <div class="mt-6 pt-6 border-t border-slate-100">
            <p class="text-xs font-semibold text-slate-700 mb-4">Application Progress Review:</p>
            ${isRejected ? `
              <div class="p-3 bg-rose-50 border border-rose-200 rounded-xl flex items-center gap-3 text-rose-800 text-xs">
                <i class="fa-solid fa-circle-xmark text-rose-600 text-sm"></i>
                <span>Thank you for your application to ScholarHire. We have proceeded with other candidates whose research directly aligns with the current term.</span>
              </div>
            ` : `
              <div class="grid grid-cols-4 gap-2 text-center">
                ${stages.map((stage, idx) => {
                  const isDone = currentIndex >= idx;
                  const isCurrent = currentIndex === idx;
                  return `
                    <div class="flex flex-col items-center">
                      <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition mb-1.5 ${isCurrent ? 'bg-brand-500 text-white ring-4 ring-brand-100' : isDone ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-400'}">
                        ${isDone ? '<i class="fa-solid fa-check text-[10px]"></i>' : idx + 1}
                      </div>
                      <span class="text-[11px] font-medium ${isCurrent ? 'text-brand-600 font-bold' : isDone ? 'text-slate-800' : 'text-slate-400'}">
                        ${stage}
                      </span>
                    </div>
                  `;
                }).join('')}
              </div>
            `}

            ${app.notes ? `
              <div class="mt-4 p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600">
                <strong class="text-slate-800 font-semibold"><i class="fa-solid fa-note-sticky text-brand-500 mr-1"></i> Committee Feedback:</strong> ${escapeHtml(app.notes)}
              </div>
            ` : ''}
          </div>

        </div>
      `;
    }

    // ==========================================
    // ADMIN PORTAL VIEWS
    // ==========================================
    function renderAdminPortal() {
      if (state.activeTab === 'manage-jobs') {
        return renderAdminManageJobsView();
      }
      if (state.activeTab === 'applicants') {
        return renderAdminApplicantsPipelineView();
      }
      return renderAdminDashboardView();
    }

    function renderAdminDashboardView() {
      const totalJobs = state.jobs.length;
      const activeJobs = state.jobs.filter(j => j.status === 'Active').length;
      const totalApps = state.applications.length;
      const hiredApps = state.applications.filter(a => a.status === 'Offer Extended').length;

      return `
        <div class="space-y-8">
          
          <!-- Admin Banner with Email Alert Indicator -->
          <div class="bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 rounded-3xl p-8 text-white relative overflow-hidden shadow-lg">
            <div class="absolute right-0 top-0 w-80 h-80 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="max-w-2xl relative z-10">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-white/10 text-brand-300 mb-3 border border-white/10">
                <i class="fa-solid fa-shield-halved text-xs"></i> ScholarHire Administrative Portal
              </span>
              <h1 class="text-3xl font-extrabold tracking-tight">Recruitment & Academic Intake</h1>
              <p class="mt-2 text-sm text-slate-300">
                Automated email alerts are active for <strong class="text-white underline">${escapeHtml(state.adminEmail)}</strong>. Every time a candidate applies, a detailed notification is routed to your inbox.
              </p>
              
              <div class="mt-6 flex flex-wrap items-center gap-3">
                <button onclick="openJobEditorModal()" class="px-5 py-2.5 bg-brand-500 hover:bg-brand-400 text-white font-semibold text-xs rounded-xl shadow-md transition flex items-center gap-2">
                  <i class="fa-solid fa-plus"></i> Post Opening
                </button>

                <button onclick="promptAdminEmail()" class="px-3 py-2.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs rounded-xl transition flex items-center gap-1.5">

                </button>

            </div>
          </div>

          <!-- Metrics Row -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            
            <div class="bg-white p-5 rounded-2xl border border-slate-200/90 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 text-xs font-medium">
                <span>Active Openings</span>

    // ==========================================
    // SHARE MODAL & SHARE FUNCTIONALITY
    // ==========================================
    function openShareModal(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (job) {
        state.activeShareModal = job;
        render();
      }
    }

    function getJobShareUrl(jobId) {
      // Create clean URL with job parameter
      const base = window.location.origin + window.location.pathname;
      return `${base}?job=${encodeURIComponent(jobId)}`;
    }

    function copyJobLink(jobId) {
      const shareUrl = getJobShareUrl(jobId);
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('🔗 Job link copied to clipboard!', 'success');
        const copyBtnText = document.getElementById('copy-btn-text');
        if (copyBtnText) {
          copyBtnText.innerText = 'Copied!';
          setTimeout(() => { if (copyBtnText) copyBtnText.innerText = 'Copy Link'; }, 2000);
        }
      }).catch(() => {
        // Fallback for clipboard
        const input = document.getElementById('share-url-input');
        if (input) {
          input.select();
          document.execCommand('copy');
          showToast('🔗 Link copied to clipboard!', 'success');
        }
      });
    }

    function triggerNativeShare(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      const shareUrl = getJobShareUrl(jobId);
      
      if (navigator.share) {
        navigator.share({
          title: `${job.title} - ScholarHire`,
          text: `Check out this academic opening for ${job.title} in ${job.department} on ScholarHire. Responsibilities: teaching undergraduates/postgraduates & conducting research.`,
          url: shareUrl
        }).catch((err) => console.log('Share dismissed', err));
      } else {
        copyJobLink(jobId);
      }
    }

              </div>

              <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">

              </div>

            </form>

          </div>
        </div>
      `;
    }

    // Admin Job Editor Modal

      return `

          <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[92vh] overflow-y-auto custom-scroll shadow-2xl border border-slate-100 p-6 sm:p-8 relative">
            
            <button onclick="closeModals()" class="absolute top-6 right-6 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">

              <h2 class="text-2xl font-extrabold text-slate-900">${isEditing ? 'Edit Job Opening' : 'Post New Scholar Opening'}</h2>

            <form onsubmit="handleJobEditorSubmit(event, ${isEditing ? `'${job.id}'` : 'null'})" class="space-y-4">
              
              <div>

                  type="text" 
                  id="job-title" 
                  required 
                  value="${job ? escapeHtml(job.title) : ''}"
                  placeholder="e.g. Associate Professor of Neuroscience"
                  class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                >
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Department / Faculty <span class="text-rose-500">*</span></label>
                  <input 
                    type="text" 
                    id="job-department" 
                    required 
                    value="${job ? escapeHtml(job.department) : ''}"
                    placeholder="e.g. Department of Physics"

                  >
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Employment Type <span class="text-rose-500">*</span></label>
                  <select

                  >

                    <option value="Part-time" ${job && job.type === 'Part-time' ? 'selected' : ''}>Part-time</option>
                    <option value="Contract" ${job && job.type === 'Contract' ? 'selected' : ''}>Contract</option>
                    <option value="Internship" ${job && job.type === 'Internship' ? 'selected' : ''}>Fellowship / Internship</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Location <span class="text-rose-500">*</span></label>
                  <input 
                    type="text" 
                    id="job-location" 
                    required 
                    value="${job ? escapeHtml(job.location) : ''}"
                    placeholder="Boston, MA (Hybrid)"
                    class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                  >
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Compensation Range</label>
                  <input 
                    type="text" 
                    id="job-salary"

                    class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                  >
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Experience Level</label>
                  <input 
                    type="text" 
                    id="job-experience" 
                    value="${job ? escapeHtml(job.experience || '') : ''}"
                    placeholder="Ph.D. or 3+ yrs research"

                  >
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Position Description <span class="text-rose-500">*</span></label>
                <textarea 
                  id="job-description" 
                  rows="3" 
                  required
                  placeholder="Detail the academic role, lab culture, courses taught, and team vision..."
                  class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                >${job ? escapeHtml(job.description) : ''}</textarea>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Key Responsibilities (Teaching & Research)</label>
                <textarea 
                  id="job-responsibilities" 
                  rows="3" 
                  placeholder="You will teach undergraduate and postgraduate students&#10;Conduct and publish research"
                  class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                >${job && job.responsibilities ? escapeHtml(job.responsibilities.join('\n')) : defaultResponsibilities}</textarea>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Requirements & Qualifications (one per line)</label>
                <textarea 
                  id="job-requirements" 
                  rows="3" 
                  placeholder="Ph.D. in relevant discipline&#10;Track record of peer-reviewed publications&#10;Excellence in student instruction"
                  class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                >${job && job.requirements ? escapeHtml(job.requirements.join('\n')) : ''}</textarea>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Application Deadline</label>
                  <input 
                    type="date" 
                    id="job-deadline" 
                    value="${job ? job.deadline || '' : ''}"
                    class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                  >
                </div>

                ${isEditing ? `
                  <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Status</label>
                    <select 
                      id="job-status"
                      class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500 bg-white"
                    >
                      <option value="Active" ${job.status === 'Active' ? 'selected' : ''}>Active</option>
                      <option value="Closed" ${job.status === 'Closed' ? 'selected' : ''}>Closed</option>
                    </select>
                  </div>
                ` : ''}
              </div>

              <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <button type="button" onclick="closeModals()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
                  Cancel
                </button>
                <button type="submit" class="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs rounded-xl shadow-md transition">
                  ${isEditing ? 'Save Changes' : 'Publish Opening'}
                </button>
              </div>

            </form>

          </div>
        </div>
      `;
    }

    // Admin Review Applicant Modal
    function renderAppReviewModal() {
      if (!state.activeAppReviewModal) return '';
      const app = state.applications.find(a => a.id === state.activeAppReviewModal);
      if (!app) return '';

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
          <div class="bg-white rounded-3xl max-w-xl w-full max-h-[92vh] overflow-y-auto custom-scroll shadow-2xl border border-slate-100 p-6 sm:p-8 relative">
            
            <button onclick="closeModals()" class="absolute top-6 right-6 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>

            <div class="mb-6">
              <div class="flex items-center gap-2 mb-2">
                <span class="px-2.5 py-0.5 rounded-md text-xs font-semibold bg-brand-50 text-brand-700">
                  Applicant Review
                </span>
                ${getStatusBadge(app.status)}
              </div>
              <h2 class="text-2xl font-extrabold text-slate-900">${escapeHtml(app.applicantName)}</h2>
              <p class="text-xs text-slate-500 mt-1">Applied for <strong class="text-slate-800">${escapeHtml(app.jobTitle)}</strong> on ${app.appliedDate}</p>
            </div>

            <div class="grid grid-cols-2 gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-100 text-xs mb-5">
              <div>
                <span class="text-slate-400 block mb-0.5">Email</span>
                <a href="mailto:${escapeHtml(app.applicantEmail)}" class="font-semibold text-brand-600 hover:underline">
                  ${escapeHtml(app.applicantEmail)}
                </a>
              </div>
              <div>
                <span class="text-slate-400 block mb-0.5">Phone</span>
                <span class="font-semibold text-slate-800">${escapeHtml(app.applicantPhone || 'Not provided')}</span>
              </div>
              ${app.linkedin ? `
                <div>
                  <span class="text-slate-400 block mb-0.5">Profile</span>
                  <a href="${escapeHtml(app.linkedin)}" target="_blank" class="font-semibold text-brand-600 hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-link text-brand-500"></i> Scholar Link
                  </a>
                </div>
              ` : ''}
              ${app.portfolio ? `
                <div>
                  <span class="text-slate-400 block mb-0.5">Website</span>
                  <a href="${escapeHtml(app.portfolio)}" target="_blank" class="font-semibold text-brand-600 hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-globe text-brand-500"></i> Lab / Site
                  </a>
                </div>
              ` : ''}
            </div>

            <div class="mb-5">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Curriculum Vitae</h4>
              <div class="p-3 bg-brand-50/60 border border-brand-200/80 rounded-xl flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 rounded-lg bg-brand-500 text-white flex items-center justify-center">
                    <i class="fa-solid fa-file-pdf"></i>
                  </div>
                  <div>
                    <div class="text-xs font-bold text-slate-800">${escapeHtml(app.resumeFileName || 'Candidate_CV.pdf')}</div>
                    <div class="text-[10px] text-slate-500">Submitted with application</div>
                  </div>
                </div>
                <button onclick="showToast('Simulating download of ' + '${escapeHtml(app.resumeFileName || 'CV.pdf')}', 'info')" class="px-3 py-1.5 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-semibold rounded-lg shadow-xs">
                  <i class="fa-solid fa-download mr-1"></i> Download
                </button>
              </div>
            </div>

            ${app.coverLetter ? `
              <div class="mb-5">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Research & Teaching Statement</h4>
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-700 leading-relaxed italic">
                  "${escapeHtml(app.coverLetter)}"
                </div>
              </div>
            ` : ''}

            <form onsubmit="handleReviewNotesSubmit(event, '${app.id}')" class="space-y-4 pt-3 border-t border-slate-100">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Update Application Stage</label>
                <select id="review-stage" class="w-full text-xs px-3.5 py-2.5 rounded-xl border border-slate-200 font-semibold text-slate-800 bg-white">
                  <option value="Applied" ${app.status === 'Applied' ? 'selected' : ''}>Applied (New)</option>
                  <option value="Under Review" ${app.status === 'Under Review' ? 'selected' : ''}>Under Review</option>
                  <option value="Interviewing" ${app.status === 'Interviewing' ? 'selected' : ''}>Interviewing / Seminar</option>
                  <option value="Offer Extended" ${app.status === 'Offer Extended' ? 'selected' : ''}>Offer Extended</option>
                  <option value="Rejected" ${app.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Committee Notes / Faculty Feedback</label>
                <textarea 
                  id="review-notes" 
                  rows="3" 
                  placeholder="Record interview notes, departmental feedback, or offer details..."
                  class="w-full text-xs p-3 rounded-xl border border-slate-200 focus:outline-hidden focus:border-brand-500"
                >${escapeHtml(app.notes || '')}</textarea>
              </div>

              <div class="pt-2 flex items-center justify-end gap-3">

                  Close

                <button type="submit" class="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-semibold text-xs rounded-xl shadow-md transition">

    // Footer Component
    function renderFooter() {
      return `
        <footer class="bg-white border-t border-slate-200/80 mt-auto py-8">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-brand-500"></span>
              <span class="font-bold text-slate-700">ScholarHire Academic & Career Tracking</span>
              <span>• Light Blue Theme</span>
            </div>
            <div class="flex items-center gap-4">
              <button onclick="promptAdminEmail()" class="text-slate-500 hover:text-brand-600 transition">
                <i class="fa-regular fa-envelope mr-1"></i> Admin Alert Email: <span class="font-mono text-slate-700">${escapeHtml(state.adminEmail)}</span>
              </button>
              <span>•</span>
              <button onclick="state.resetToDefaults()" class="text-slate-400 hover:text-slate-700 transition">
                <i class="fa-solid fa-arrow-rotate-left mr-1"></i> Reset Demo Data
              </button>
            </div>
          </div>
        </footer>
      `;
    }

    // Controllers & Handlers
    function openJobDetailModal(jobId) {
      state.activeJobModal = jobId;
      render();
    }

    function openApplyModal(jobId) {
      state.activeApplyModal = jobId;
      render();
    }

    function openJobEditorModal(jobId = null) {
      if (jobId) {
        state.activeJobEditorModal = state.jobs.find(j => j.id === jobId);
      } else {
        state.activeJobEditorModal = true;
      }
      render();
    }

    function openAppReviewModal(appId) {
      state.activeAppReviewModal = appId;
      render();
    }

    function closeModals() {
      state.activeJobModal = null;
      state.activeApplyModal = null;
      state.activeJobEditorModal = null;
      state.activeAppReviewModal = null;
      state.activeEmailPreviewModal = null;
      state.activeShareModal = null;
      render();
    }

    function handleResumeFileChosen(input) {
      if (input.files && input.files[0]) {
        document.getElementById('resume-label').innerText = 'Selected: ' + input.files[0].name;
        document.getElementById('resume-label').classList.add('text-brand-600');
      }
    }

    function handleApplySubmit(e, jobId) {
      e.preventDefault();
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;

      const name = document.getElementById('apply-name').value.trim();
      const email = document.getElementById('apply-email').value.trim();
      const phone = document.getElementById('apply-phone').value.trim();
      const experience = document.getElementById('apply-experience').value.trim();
      const linkedin = document.getElementById('apply-linkedin').value.trim();
      const portfolio = document.getElementById('apply-portfolio').value.trim();
      const coverLetter = document.getElementById('apply-coverletter').value.trim();
      const resumeInput = document.getElementById('apply-resume');

      let resumeFileName = `${name.replace(/\s+/g, '_')}_CV.pdf`;
      if (resumeInput && resumeInput.files && resumeInput.files[0]) {
        resumeFileName = resumeInput.files[0].name;
      }

      state.addApplication({
        jobId: job.id,
        jobTitle: job.title,
        applicantName: name,
        applicantEmail: email,
        applicantPhone: phone,
        experience: experience,
        linkedin: linkedin,
        portfolio: portfolio,
        coverLetter: coverLetter,
        resumeFileName: resumeFileName
      });

      state.userEmail = email;
      state.save();

      closeModals();
      state.activeTab = 'my-apps';
      render();
    }

    function handleJobEditorSubmit(e, jobId = null) {
      e.preventDefault();
      const title = document.getElementById('job-title').value.trim();
      const department = document.getElementById('job-department').value.trim();
      const type = document.getElementById('job-type').value;
      const location = document.getElementById('job-location').value.trim();
      const salary = document.getElementById('job-salary').value.trim();
      const experience = document.getElementById('job-experience').value.trim();
      const description = document.getElementById('job-description').value.trim();
      const deadline = document.getElementById('job-deadline').value;
      
      const responsibilitiesRaw = document.getElementById('job-responsibilities').value;
      const responsibilities = responsibilitiesRaw
        .split('\n')
        .map(r => r.trim())
        .filter(r => r.length > 0);

      const requirementsRaw = document.getElementById('job-requirements').value;
      const requirements = requirementsRaw
        .split('\n')
        .map(r => r.trim())
        .filter(r => r.length > 0);

      if (jobId) {
        const statusSelect = document.getElementById('job-status');
        const status = statusSelect ? statusSelect.value : 'Active';
        state.updateJob(jobId, {
          title,
          department,
          type,
          location,
          salary,
          experience,
          description,
          responsibilities,
          requirements,
          deadline,
          status
        });
      } else {
        state.addJob({
          title,
          department,
          type,
          location,
          salary,
          experience,
          description,
          responsibilities,
          requirements,
          deadline
        });
      }

      closeModals();
    }

    function handleReviewNotesSubmit(e, appId) {
      e.preventDefault();
      const stage = document.getElementById('review-stage').value;
      const notes = document.getElementById('review-notes').value.trim();
      state.updateApplicationStatus(appId, stage, notes);
      closeModals();
    }

    function promptUserEmail() {
      const newEmail = prompt('Enter candidate email address to filter and manage your applications:', state.userEmail);
      if (newEmail && newEmail.trim()) {
        state.userEmail = newEmail.trim();
        state.save();
        render();
        showToast(`Switched active candidate to ${state.userEmail}`, 'info');
      }
    }

    function promptAdminEmail() {
      const newEmail = prompt('Enter the administrator email address to receive new application alerts:', state.adminEmail);
      if (newEmail && newEmail.trim()) {
        state.setAdminEmail(newEmail.trim());
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initial render
    render();
  </script>
</body>
</html>
